name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm install --prefix typescript
      - run: npm install --prefix cli
      - run: npm install --prefix samples/typescript/user-roles-simple-cli
      - run: npm install --prefix samples/typescript/contacts-crud-enriched-medium-rest
      - run: git clone --depth 1 --branch main https://github.com/deterministic-code/deterministic-generators-common.git deterministic-generators-common
      - run: npm test
      - run: cargo test --workspace --manifest-path rust/Cargo.toml
        env:
          RUSTFLAGS: -D warnings
      - run: dotnet test csharp/Datasources.slnx
