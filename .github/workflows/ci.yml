name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci --prefix typescript
      - run: npm test
      - run: cargo test --workspace --manifest-path rust/Cargo.toml
      - run: dotnet test csharp/Datasources.slnx

  e2e:
    runs-on: ubuntu-latest
    env:
      MYSQL_URL: mysql://ds:ds@127.0.0.1:3306/datasources
      POSTGRES_URL: postgres://ds:ds@127.0.0.1:5432/datasources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: docker compose up -d --wait
      - run: npm ci --prefix typescript
      - run: npm run test:e2e:ci
      - run: npm run test:e2e:rust
      - run: npm run test:e2e:csharp
