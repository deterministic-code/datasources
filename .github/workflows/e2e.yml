name: e2e
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      MYSQL_URL: mysql://ds:ds@127.0.0.1:3306/datasources
      POSTGRES_URL: postgres://ds:ds@127.0.0.1:5432/datasources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: docker compose -p datasources -f docker/compose.yml up -d --wait
      - run: npm install --prefix typescript
      - run: npm install --prefix cli
      - run: npm install --prefix samples/typescript/user-roles-simple-cli
      - run: npm install --prefix samples/typescript/contacts-crud-enriched-medium-rest
      - run: npm run test:e2e:ci
      - run: npm run test:e2e:rust
      - run: npm run test:e2e:csharp
      - run: npm run test:e2e:samples
