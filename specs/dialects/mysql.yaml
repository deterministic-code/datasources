createUserTable: |
  CREATE TABLE "user" (
    id INT PRIMARY KEY AUTO_INCREMENT,
    username TEXT NOT NULL,
    is_enabled INT NOT NULL,
    created TEXT NOT NULL
  )
createUserTableVersioned: |
  CREATE TABLE "user" (
    id INT PRIMARY KEY AUTO_INCREMENT,
    username TEXT NOT NULL,
    is_enabled INT NOT NULL,
    created TEXT NOT NULL,
    version INT NOT NULL
  )
