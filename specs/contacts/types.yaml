version: 1.0.0
types:
  - base:
      fields:
        - id:
            type: integer
            is_id: true
        - uuid:
            type: uuid
        - created:
            type: datetime
        - updated:
            type: datetime
        - version:
            type: binary
  - contact_source:
      tags: [datasource_type]
      inherits: base
      fields:
        - name:
            type: string
            size: 64
        - description:
            type: string
            size: unlimited
            is_nullable: true
  - contact_type:
      tags: [datasource_type]
      inherits: base
      fields:
        - name:
            type: string
            size: 64
        - description:
            type: string
            size: unlimited
            is_nullable: true
  - contacts_base:
      tags: [datasource_type]
      inherits: base
      fields:
        - contact_source_id:
            type: integer
            references: contact_source.id
        - contact_type_id:
            type: integer
            references: contact_type.id
        - first_name:
            type: string
            size: 128
        - last_name:
            type: string
            size: 128
        - email:
            type: string
            size: 256
            is_nullable: true
        - notes:
            type: string
            size: unlimited
            is_nullable: true
  - address_type:
      tags: [datasource_type]
      inherits: base
      fields:
        - name:
            type: string
            size: 64
        - description:
            type: string
            size: unlimited
            is_nullable: true
  - phone_type:
      tags: [datasource_type]
      inherits: base
      fields:
        - name:
            type: string
            size: 64
        - description:
            type: string
            size: unlimited
            is_nullable: true
  - address:
      tags: [datasource_type]
      inherits: base
      fields:
        - contact_id:
            type: integer
            references: contacts_base.id
        - address_type_id:
            type: integer
            references: address_type.id
        - line1:
            type: string
            size: 256
        - line2:
            type: string
            size: 256
            is_nullable: true
        - city:
            type: string
            size: 128
        - region:
            type: string
            size: 128
            is_nullable: true
        - postal_code:
            type: string
            size: 32
            is_nullable: true
        - country:
            type: string
            size: 64
            is_nullable: true
  - phone:
      tags: [datasource_type]
      inherits: base
      fields:
        - contact_id:
            type: integer
            references: contacts_base.id
        - phone_type_id:
            type: integer
            references: phone_type.id
        - number:
            type: string
            size: 32
  - contact_groups_base:
      tags: [datasource_type]
      inherits: base
      fields:
        - name:
            type: string
            size: 64
        - description:
            type: string
            size: unlimited
            is_nullable: true
  - contact_group_member:
      tags: [datasource_type]
      inherits: base
      fields:
        - contact_id:
            type: integer
            references: contacts_base.id
        - contact_group_id:
            type: integer
            references: contact_groups_base.id
  - legacy_contact:
      tags: [datasource_type]
      fields:
        - key:
            type: string
            size: 64
            is_id: true
        - first_name:
            type: string
            size: 128
        - last_name:
            type: string
            size: 128
        - email:
            type: string
            size: 256
            is_nullable: true
        - imported_at:
            type: datetime
            is_nullable: true
  - contact_change_log:
      tags: [datasource_type]
      inherits: base
      fields:
        - occurred_at:
            type: datetime
        - contact_id:
            type: integer
            references: contacts_base.id
        - changed_by:
            type: string
            size: 128
        - change_summary:
            type: string
            size: unlimited
