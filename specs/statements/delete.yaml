# Shared DELETE grammar. C#, Rust, and TypeScript must all pass this file.
# expr, ident, param, and select (subqueries) are the SELECT grammar.
name: delete
grammar: |
  delete      = "DELETE" "FROM" ident where?
  where       = "WHERE" expr
  expr        = or_expr
  or_expr     = and_expr ("OR" and_expr)*
  and_expr    = not_expr ("AND" not_expr)*
  not_expr    = "NOT" "(" expr ")" | predicate
  predicate   = "EXISTS" subquery
              | primary null_test
              | primary "NOT" "IN" "(" in_list ")"
              | primary "IN" "(" in_list ")"
              | primary "NOT" "BETWEEN" param "AND" param
              | primary "BETWEEN" param "AND" param
              | primary "NOT" "LIKE" param
              | primary "LIKE" param
              | primary (cmp_op primary)?
  in_list     = param ("," param)* | select
  null_test   = "IS" "NULL" | "IS" "NOT" "NULL"
  cmp_op      = "=" | "<>" | ">" | "<" | ">=" | "<="
  primary     = ident | param | integer | string | "true" | "false" | "null" | subquery | "(" expr ")"
  param       = "$" ident
  subquery    = "(" select ")"
  string      = "'" (any except "'" | "''")* "'"
  ident       = part ("." part)*
  part        = name | quoted
  name        = letter (letter | digit | "_")*
  quoted      = '"' (any except '"' | '""')* '"'
examples:
  - name: where
    sql: DELETE FROM users WHERE id = $id
    table: users
    where: { op: eq, value: id }
  - name: all rows
    sql: DELETE FROM users
    table: users
  - name: quoted table
    sql: DELETE FROM "user" WHERE id = $id
    table: '"user"'
  - name: not like
    sql: DELETE FROM users WHERE name NOT LIKE $name
    where: { op: notLike, value: name, pattern: name }
