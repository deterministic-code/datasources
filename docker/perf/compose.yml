services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: datasources
      MYSQL_USER: ds
      MYSQL_PASSWORD: ds
    volumes:
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "23306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uds", "-pds"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ds
      POSTGRES_PASSWORD: ds
      POSTGRES_DB: datasources
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds -d datasources"]
      interval: 5s
      timeout: 5s
      retries: 20
