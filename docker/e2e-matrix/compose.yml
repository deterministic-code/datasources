services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: datasources
      MYSQL_USER: ds
      MYSQL_PASSWORD: ds
    volumes:
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/mysql
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uds", "-pds"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ds
      POSTGRES_PASSWORD: ds
      POSTGRES_DB: datasources
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds -d datasources"]
      interval: 5s
      timeout: 5s
      retries: 20
  matrix:
    profiles: ["runner"]
    build: .
    working_dir: /work
    volumes:
      - ${WORK}:/work
    environment:
      E2E_MATRIX_IN_DOCKER: "1"
      MYSQL_URL: mysql://ds:ds@mysql:3306/datasources
      POSTGRES_URL: postgres://ds:ds@postgres:5432/datasources
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["node", "scripts/e2e-matrix.mjs"]
