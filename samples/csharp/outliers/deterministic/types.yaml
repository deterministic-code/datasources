version: 1.0.0
types:
  - category:
      tags: [datasource_type]
      fields:
        - id: { type: integer, is_id: true }
        - parent_category_id:
            references: category.id
            is_nullable: true
        - name: { type: string, size: 128 }
  - category_tree:
      tags: [view_type, tree, readonly_lookup]
      inherits: category
      fields:
        - children:
            type: category_tree[]
            references: category.parent_category_id
  - region_category:
      tags: [datasource_type]
      fields:
        - region_id: { type: integer, is_id: true }
        - category_id: { type: integer, is_id: true }
        - parent_region_id:
            references: region_category.region_id
            is_nullable: true
        - parent_category_id:
            references: region_category.category_id
            is_nullable: true
        - name: { type: string, size: 128 }
  - region_category_tree:
      tags: [view_type, tree, readonly_lookup]
      inherits: region_category
      fields:
        - children:
            type: region_category_tree[]
            references: [region_category.parent_region_id, region_category.parent_category_id]
  - node:
      tags: [datasource_type]
      fields:
        - id: { type: integer, is_id: true }
        - value: { type: string, size: 128 }
  - node_edge:
      tags: [datasource_type, many_to_many]
      fields:
        - from_node_id: { references: node.id }
        - to_node_id: { references: node.id }
  - node_graph:
      tags: [view_type, graph, readonly_lookup]
      inherits: node
      fields:
        - edges:
            type: node_graph[]
            references: node_edge.from_node_id
  - ward:
      tags: [datasource_type]
      fields:
        - region_id: { type: integer, is_id: true }
        - ward_id: { type: integer, is_id: true }
        - name: { type: string, size: 128 }
  - ward_alias:
      tags: [datasource_type]
      fields:
        - id: { type: integer, is_id: true }
        - parent_region_id:
            references: ward.region_id
        - parent_ward_id:
            references: ward.ward_id
        - name: { type: string, size: 128 }
  - ward_setting:
      tags: [datasource_type]
      fields:
        - id: { type: integer, is_id: true }
        - parent_region_id:
            references: ward.region_id
        - parent_ward_id:
            references: ward.ward_id
        - name: { type: string, size: 64 }
        - value: { type: string, size: 256 }
  - ward_setting_map:
      tags: [view_type]
      inherits: dictionary
      fields:
        - key:
            type: string
            size: 64
            references: ward_setting.name
        - value:
            type: string
            size: 256
            references: ward_setting.value
  - ward_node:
      tags: [datasource_type]
      fields:
        - id: { type: integer, is_id: true }
        - parent_region_id:
            references: ward.region_id
        - parent_ward_id:
            references: ward.ward_id
        - name: { type: string, size: 128 }
  - ward_view:
      tags: [view_type]
      inherits: ward
      fields:
        - aliases:
            type: ward_alias[]
            references: [ward_alias.parent_region_id, ward_alias.parent_ward_id]
        - settings:
            type: ward_setting_map{}
            references: [ward_setting.parent_region_id, ward_setting.parent_ward_id]
        - nodes:
            type: ward_node[]
            references: [ward_node.parent_region_id, ward_node.parent_ward_id]
  - badge:
      tags: [datasource_type]
      fields:
        - badge_id: { type: uuid, is_id: true }
        - code: { type: string, size: 64, is_id: true }
        - name: { type: string, size: 128 }
  - badge_alias:
      tags: [datasource_type]
      fields:
        - id: { type: integer, is_id: true }
        - parent_badge_id:
            references: badge.badge_id
        - parent_code:
            references: badge.code
        - name: { type: string, size: 128 }
  - badge_setting:
      tags: [datasource_type]
      fields:
        - id: { type: integer, is_id: true }
        - parent_badge_id:
            references: badge.badge_id
        - parent_code:
            references: badge.code
        - name: { type: string, size: 64 }
        - value: { type: string, size: 256 }
  - badge_setting_map:
      tags: [view_type]
      inherits: dictionary
      fields:
        - key:
            type: string
            size: 64
            references: badge_setting.name
        - value:
            type: string
            size: 256
            references: badge_setting.value
  - badge_node:
      tags: [datasource_type]
      fields:
        - id: { type: integer, is_id: true }
        - parent_badge_id:
            references: badge.badge_id
        - parent_code:
            references: badge.code
        - name: { type: string, size: 128 }
  - badge_view:
      tags: [view_type]
      inherits: badge
      fields:
        - aliases:
            type: badge_alias[]
            references: [badge_alias.parent_badge_id, badge_alias.parent_code]
        - settings:
            type: badge_setting_map{}
            references: [badge_setting.parent_badge_id, badge_setting.parent_code]
        - nodes:
            type: badge_node[]
            references: [badge_node.parent_badge_id, badge_node.parent_code]
