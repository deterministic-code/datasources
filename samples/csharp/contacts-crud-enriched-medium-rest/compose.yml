services:
  mysql:
    image: mysql:8
    restart: "no"
    stop_grace_period: 0s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: datasources
      MYSQL_USER: ds
      MYSQL_PASSWORD: ds
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/mysql
      - /tmp
    command: ["--innodb-buffer-pool-size=64M", "--tls-version=", "--mysql-native-password=ON"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uds", "-pds"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: postgres:16
    restart: "no"
    stop_grace_period: 0s
    environment:
      POSTGRES_USER: ds
      POSTGRES_PASSWORD: ds
      POSTGRES_DB: datasources
    tmpfs:
      - /var/lib/postgresql/data
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds -d datasources"]
      interval: 5s
      timeout: 5s
      retries: 20
  runner:
    build:
      context: ../../..
      dockerfile: samples/csharp/contacts-crud-enriched-medium-rest/Dockerfile
    restart: "no"
    stop_grace_period: 0s
    tmpfs:
      - /tmp
      - /work
    working_dir: /work
    environment:
      MYSQL_URL: mysql://ds:ds@mysql:3306/datasources
      POSTGRES_URL: postgres://ds:ds@postgres:5432/datasources
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy

