version: 1.0.0
types:
  - base:
      fields:
        - id:
            type: integer
            is_id: true
        - uuid:
            type: uuid
            default_value: NewId
        - created:
            type: datetime
            default_value: UtcNow
        - updated:
            type: binary
            default_value: "Hex('00')"
  - user_base:
      tags:
        - datasource_type
      inherits: base
      fields:
        - username:
            type: string
        - password:
            type: string
        - is_enabled:
            type: boolean
            default_value: true
  - role:
      tags:
        - datasource_type
      inherits: base
      fields:
        - name:
            type: string
        - description:
            type: string
            default_value: ""
        - is_enabled:
            type: boolean
            default_value: true
  - group:
      tags:
        - datasource_type
      inherits: base
      fields:
        - name:
            type: string
        - description:
            type: string
            default_value: ""
        - is_enabled:
            type: boolean
            default_value: true
  - user_group:
      tags:
        - datasource_type
        - many_to_many
      inherits: base
      fields:
        - user_id:
            references: user_base.id
        - group_id:
            references: group.id
  - user_role:
      tags:
        - datasource_type
        - many_to_many
      inherits: base
      fields:
        - user_id:
            references: user_base.id
        - role_id:
            references: role.id
  - user:
      tags:
        - view_type
      inherits: user_base
      fields:
        - roles:
            type: role[]
            references: user_role.user_id
        - groups:
            type: group[]
            references: user_group.user_id
