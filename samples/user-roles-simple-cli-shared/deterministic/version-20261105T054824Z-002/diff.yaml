datasource.yaml:
  types:
    added:
      - user_base:
          mapping: user
types.yaml:
  types:
    added:
      - user_base:
          tags:
            - datasource_type
          inherits: base
          fields:
            - username:
                type: string
            - password:
                type: string
            - is_enabled:
                type: boolean
                default_value: true
    changed:
      - user_group:
          tags:
            - datasource_type
            - many_to_many
          fields:
            changed:
              - user_id:
                  references: user_base.id
      - user_role:
          tags:
            - datasource_type
            - many_to_many
          fields:
            changed:
              - user_id:
                  references: user_base.id
    removed:
      - user
