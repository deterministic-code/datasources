version: 1.0.0
types:
  - user:
      tags:
        - datasource_type
      fields:
        - id:
            type: integer
            is_id: true
        - username:
            type: string
        - password:
            type: string
        - is_enabled:
            type: boolean
            default_value: true
        - created:
            type: datetime
        - updated:
            type: binary
            default_value: "Hex('00')"
  - role:
      tags:
        - datasource_type
      fields:
        - id:
            type: integer
            is_id: true
        - name:
            type: string
        - is_enabled:
            type: boolean
            default_value: true
        - created:
            type: datetime
        - updated:
            type: binary
            default_value: "Hex('00')"
  - group:
      tags:
        - datasource_type
      fields:
        - id:
            type: integer
            is_id: true
        - name:
            type: string
        - is_enabled:
            type: boolean
            default_value: true
        - created:
            type: datetime
        - updated:
            type: binary
            default_value: "Hex('00')"
  - user_group:
      tags:
        - datasource_type
      fields:
        - id:
            type: integer
            is_id: true
        - user_id:
            references: user.id
        - group_id:
            references: group.id
        - created:
            type: datetime
        - updated:
            type: binary
            default_value: "Hex('00')"
  - user_role:
      tags:
        - datasource_type
      fields:
        - id:
            type: integer
            is_id: true
        - user_id:
            references: user.id
        - role_id:
            references: role.id
        - created:
            type: datetime
        - updated:
            type: binary
            default_value: "Hex('00')"
