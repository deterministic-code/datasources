contacts-crud-enriched-medium-rest-types.yaml:
  added: true
  content:
    version: 1.0.0
    types:
      - base:
          fields:
            - id:
                type: integer
                is_id: true
            - uuid:
                type: uuid
                default_value: NewId
            - created:
                type: datetime
                default_value: UtcNow
            - updated:
                type: datetime
                default_value: UtcNow
            - version:
                type: binary
                default_value: Hex('00')
      - contact_source:
          tags:
            - datasource_type
            - readonly_lookup
          inherits: base
          fields:
            - name:
                type: string
                size: 64
            - description:
                type: string
                size: unlimited
                is_nullable: true
      - address_type:
          tags:
            - datasource_type
            - readonly_lookup
          inherits: base
          fields:
            - name:
                type: string
                size: 64
            - description:
                type: string
                size: unlimited
                is_nullable: true
      - phone_type:
          tags:
            - datasource_type
            - readonly_lookup
          inherits: base
          fields:
            - name:
                type: string
                size: 64
            - description:
                type: string
                size: unlimited
                is_nullable: true
      - contacts_base:
          tags:
            - datasource_type
          inherits: base
          fields:
            - contact_source_id:
                references: contact_source.id
            - first_name:
                type: string
                size: 128
            - last_name:
                type: string
                size: 128
            - email:
                type: string
                size: 256
                is_nullable: true
            - notes:
                type: string
                size: unlimited
                is_nullable: true
      - address_base:
          tags:
            - datasource_type
          inherits: base
          fields:
            - latitude:
                type: integer
                is_nullable: true
            - label_note:
                type: string
                size: 128
                is_nullable: true
            - floor:
                type: unsignedinteger
                is_nullable: true
            - score:
                type: decimal
                size:
                  - 10
                  - 2
                is_nullable: true
            - external_id:
                type: uuid
                is_nullable: true
            - is_verified:
                type: boolean
                is_nullable: true
            - verified_at:
                type: datetime
                is_nullable: true
            - stamp:
                type: binary
                is_nullable: true
            - contact_id:
                references: contacts_base.id
            - address_type_id:
                references: address_type.id
            - line1:
                type: string
                size: 256
            - line2:
                type: string
                size: 256
                is_nullable: true
            - city:
                type: string
                size: 128
            - region:
                type: string
                size: 128
                is_nullable: true
            - postal_code:
                type: string
                size: 32
                is_nullable: true
            - country:
                type: string
                size: 64
                is_nullable: true
      - phone_base:
          tags:
            - datasource_type
          inherits: base
          fields:
            - contact_id:
                references: contacts_base.id
            - phone_type_id:
                references: phone_type.id
            - number:
                type: string
                size: 32
            - label:
                type: string
                size: 32
                is_nullable: true
      - contact_groups_base:
          tags:
            - datasource_type
          inherits: base
          fields:
            - name:
                type: string
                size: 128
            - description:
                type: string
                size: unlimited
                is_nullable: true
      - contact:
          tags:
            - view_type
          inherits: contacts_base
          union:
            - contact_source
          extract:
            - contact_source.name
            - contact_source.description
          mapping:
            name: contact_source_name
          fields:
            - addresses:
                type: address[]
                references: address.contact_id
            - phones:
                type: phone[]
                references: phone.contact_id
            - settings:
                type: contact_settings_map{}
                references: contact_settings.contact_id
            - prefs:
                type: contact_preferences_map{}
                references: contact_preferences.contact_id
          remove_fields:
            - contact_source_id
      - contact_settings:
          tags:
            - datasource_type
          inherits: base
          fields:
            - contact_id:
                references: contacts_base.id
            - key:
                type: string
                size: 64
            - value:
                type: string
                size: unlimited
      - contact_settings_map:
          tags:
            - view_type
          inherits: dictionary
          fields:
            - key:
                type: string
                size: 64
            - value:
                type: string
                size: unlimited
      - locale_preferences:
          tags:
            - view_type
          fields:
            - locale:
                type: string
                size: 16
            - timezone:
                type: string
                size: 64
      - contact_preferences:
          tags:
            - datasource_type
          inherits: base
          fields:
            - contact_id:
                references: contacts_base.id
            - key:
                type: string
                size: 64
            - locale:
                type: string
                size: 16
            - timezone:
                type: string
                size: 64
      - contact_preferences_map:
          tags:
            - view_type
          inherits: dictionary
          fields:
            - key:
                type: string
                size: 64
            - value:
                type: locale_preferences
      - card_labels:
          tags:
            - view_type
          inherits: dictionary
          fields:
            - key:
                type: string
                size: 64
            - value:
                type: string
                size: 128
      - contact_card:
          tags:
            - view_type
          fields:
            - display_name:
                type: string
                size: 256
      - address:
          tags:
            - view_type
          inherits: address_base
          union:
            - address_type
          extract:
            - address_type.name
            - address_type.description
          mapping:
            name: address_type_name
          fields: []
          remove_fields:
            - address_type_id
      - phone:
          tags:
            - view_type
          inherits: phone_base
          union:
            - phone_type
          extract:
            - phone_type.name
            - phone_type.description
          mapping:
            name: phone_type_name
          fields: []
          remove_fields:
            - phone_type_id
      - contact_group:
          tags:
            - view_type
          inherits: contact_groups_base
          fields:
            - members:
                type: contact[]
                references: contact_group_member.contact_group_id
      - contact_group_member:
          tags:
            - datasource_type
            - many_to_many
          inherits: base
          fields:
            - contact_id:
                references: contacts_base.id
            - contact_group_id:
                references: contact_groups_base.id
      - legacy_contact:
          tags:
            - datasource_type
            - view_type
          fields:
            - key:
                type: string
                size: 64
            - first_name:
                type: string
                size: 128
            - last_name:
                type: string
                size: 128
            - email:
                type: string
                size: 256
                is_nullable: true
            - imported_at:
                type: datetime
                is_nullable: true
      - contact_change_log:
          tags:
            - datasource_type
            - view_type
          inherits: set
          fields:
            - occurred_at:
                type: datetime
            - contact_id:
                type: integer
            - changed_by:
                type: string
                size: 128
            - change_summary:
                type: string
                size: unlimited
      - import_contacts_request:
          fields:
            - source:
                type: string
                size: 64
            - payload:
                type: string
                size: unlimited
      - import_contacts_result:
          fields:
            - imported_count:
                type: integer
            - skipped_count:
                type: integer
            - failed_count:
                type: integer
      - legacy_migration_result:
          fields:
            - migrated_count:
                type: integer
            - skipped_count:
                type: integer
            - completed_at:
                type: datetime
                is_nullable: true
datasource.sqlite.yaml:
  added: true
  content:
    version: 1.0.0
    includes:
      - types:
          filter: tag == "datasource_type"
    types:
      - base:
          fields:
            - id:
                include_in_create: false
                include_in_update: false
            - uuid:
                include_in_create: true
            - created:
                include_in_create: true
            - updated:
                include_in_create: false
                include_in_update: false
            - version:
                include_in_create: true
      - user_settings:
          indexes:
            - user_settings_user_id_name:
                fields:
                  - user_id
                  - name
                is_unique: true
      - game_settings:
          indexes:
            - game_settings_game_id_name:
                fields:
                  - game_id
                  - name
                is_unique: true
      - games_categories:
          indexes:
            - games_categories_game_id_category_id:
                fields:
                  - game_id
                  - category_id
                is_unique: true
