[package]
name = "contacts-simple-cli"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "contacts-simple-cli"
path = "src/main.rs"

[dependencies]
datasources = { version = "0.1.24", path = "../../../rust/datasources" }
datasources-mysql = { version = "0.1.24", path = "../../../rust/providers/mysql", default-features = false }
datasources-postgres = { version = "0.1.24", path = "../../../rust/providers/postgres" }
datasources-sqlite = { version = "0.1.24", path = "../../../rust/providers/sqlite" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[lints.rust]
warnings = "deny"
