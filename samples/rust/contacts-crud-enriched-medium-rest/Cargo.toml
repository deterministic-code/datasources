[package]
name = "contacts-crud-enriched-medium-rest"
version = "0.1.0"
edition = "2021"
autobins = false
default-run = "contacts-crud-enriched-medium-rest"

[[bin]]
name = "contacts-crud-enriched-medium-rest"
path = "e2e/main.rs"

[[bin]]
name = "matrix"
path = "src/bin/matrix.rs"

[[bin]]
name = "perf"
path = "src/bin/perf.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
warnings = "deny"
