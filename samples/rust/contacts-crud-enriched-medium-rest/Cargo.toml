[package]
name = "contacts-crud-enriched-medium-rest"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "generate-e2e"
path = "e2e/main.rs"

[dependencies]
ctor = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
datasources = { path = "../../../rust/datasources" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
datasources-mysql = { path = "../../../rust/providers/mysql" }
datasources-postgres = { path = "../../../rust/providers/postgres" }
datasources-sqlite = { path = "../../../rust/providers/sqlite" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[lints.rust]
warnings = "deny"
