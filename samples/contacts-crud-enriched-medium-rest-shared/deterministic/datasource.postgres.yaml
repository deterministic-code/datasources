version: 1.0.0
includes:
  - types:
      filter: tag == "datasource_type"
types:
  - base:
      fields:
        - uuid:
            include_in_create: false
        - created:
            include_in_create: false
            include_in_update: false
        - updated:
            include_in_create: false
            include_in_update: false
        - version:
            include_in_create: false
  - contact_source:
      fields:
        - name:
            is_unique: true
  - contacts_base:
      mapping: contacts
  - address_base:
      mapping: addresses
  - phone_base:
      mapping: phones
  - contact_groups_base:
      mapping: contact_groups
      fields:
        - name:
            is_unique: true
  - legacy_contact:
      mapping: OldContactsTbl
      fields:
        - key:
            is_fixed_id: true
            is_readonly: true
            is_unique: true
            mapping: CntID
        - first_name:
            mapping: FirstNm
        - last_name:
            mapping: LastNm
        - email:
            mapping: EmailAddr
        - imported_at:
            mapping: ImpDate
