version: 1.0.0
includes:
  - types:
      filter: tag == "datasource_type"
types:
  - base:
      fields:
        - created:
            include_in_create: false
            include_in_update: false
        - updated:
            include_in_create: false
            include_in_update: false
  - contact_source:
      fields:
        - name:
            is_unique: true
  - contacts_base:
      mapping: contacts
      fields:
        - notes:
            include_in_create: true
            include_in_update: true
  - address_base:
      mapping: addresses
      fields:
        - country:
            include_in_create: true
            include_in_update: true
  - phone_base:
      mapping: phones
      fields:
        - label:
            include_in_create: true
            include_in_update: true
  - contact_groups_base:
      mapping: contact_groups
      fields:
        - name:
            is_unique: true
  - legacy_contact:
      mapping: OldContactsTbl
      fields:
        - key:
            is_fixed_id: true
            is_readonly: true
            is_unique: true
            mapping: CntID
        - first_name:
            mapping: FirstNm
        - last_name:
            mapping: LastNm
        - email:
            mapping: EmailAddr
        - imported_at:
            mapping: ImpDate
