services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: datasources
      MYSQL_USER: ds
      MYSQL_PASSWORD: ds
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    restart: "no"
    tmpfs:
      - /var/lib/mysql
      - /tmp
    ports:
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uds", "-pds"]
      interval: 1s
      timeout: 2s
      retries: 30
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ds
      POSTGRES_PASSWORD: ds
      POSTGRES_DB: datasources
    restart: "no"
    tmpfs:
      - /var/lib/postgresql/data
      - /tmp
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds -d datasources"]
      interval: 1s
      timeout: 2s
      retries: 30
