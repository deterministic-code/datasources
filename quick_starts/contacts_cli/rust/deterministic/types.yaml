version: 1.0.0
types:
  - base:
      fields:
        - id:
            type: integer
            is_id: true
        - uuid:
            type: uuid
            default_value: NewId
        - created:
            type: datetime
            default_value: UtcNow
        - updated:
            type: datetime
            default_value: UtcNow
        - version:
            type: binary
            default_value: Hex('00')
  - gender:
      tags:
        - datasource_type
        - readonly_lookup
      inherits: base
      fields:
        - name:
            type: string
            size: 128
        - description:
            type: string
            size: unlimited
            default_value: ""
  - contact_base:
      tags:
        - datasource_type
      inherits: base
      fields:
        - name:
            type: string
            size: 512
        - given_name:
            type: string
            size: 512
        - additional_name:
            type: string
            size: 512
            default_value: ""
        - pronunciation:
            type: string
            size: 512
            default_value: ""
        - family_name:
            type: string
            size: 512
            default_value: ""
        - nick_name:
            type: string
            size: 512
            default_value: ""
        - job_title:
            type: string
            size: 512
            default_value: ""
        - gender_type_id:
            references: gender.id
        - organization:
            type: string
            size: 512
            default_value: ""
        - is_starred:
            type: boolean
        - is_favorite:
            type: boolean
        - is_deleted:
            type: boolean
  - email_type:
      tags:
        - datasource_type
        - readonly_lookup
      inherits: base
      fields:
        - name:
            type: string
            size: 128
        - description:
            type: string
            size: unlimited
            default_value: ""
  - email_base:
      tags:
        - datasource_type
      inherits: base
      fields:
        - email_type_id:
            references: email_type.id
        - contact_id:
            references: contact_base.id
        - address:
            type: string
            size: 320
            default_value: ""
        - display_name:
            type: string
            size: 256
            default_value: ""
        - is_primary:
            type: boolean
  - phone_type:
      tags:
        - datasource_type
        - readonly_lookup
      inherits: base
      fields:
        - name:
            type: string
            size: 128
        - description:
            type: string
            size: unlimited
            default_value: ""
  - phone_base:
      tags:
        - datasource_type
      inherits: base
      fields:
        - phone_type_id:
            references: phone_type.id
        - contact_id:
            references: contact_base.id
        - number:
            type: string
            size: 20
        - display_name:
            type: string
            size: 256
        - extention:
            type: string
            size: 10
        - is_primary:
            type: boolean
        - is_verified:
            type: boolean
            default_value: false
  - address_type:
      tags:
        - datasource_type
        - readonly_lookup
      inherits: base
      fields:
        - name:
            type: string
            size: 128
        - description:
            type: string
            size: unlimited
            default_value: ""
  - address_base:
      tags:
        - datasource_type
        - readonly_lookup
      inherits: base
      fields:
        - contact_id:
            references: contact_base.id
        - address_type_id:
            references: address_type.id
        - display_name:
            type: string
            size: 255
            default_value: ""
        - line_1:
            type: string
            size: 255
        - line_2:
            type: string
            size: 255
            default_value: ""
        - line_3:
            type: string
            size: 255
            default_value: ""
        - neighborhood:
            type: string
            size: 100
            default_value: ""
        - district:
            type: string
            size: 100
            default_value: ""
        - city:
            type: string
            size: 100
        - state_province:
            type: string
            size: 100
            default_value: ""
        - postal_code:
            type: string
            size: 20
            default_value: ""
        - country_code:
            type: string
            size: 2
        - formatted_address:
            type: string
            size: unlimited
            default_value: ""
        - latitude:
            type: integer
            is_nullable: true
        - longitude:
            type: integer
            is_nullable: true
        - is_primary:
            type: boolean
            default_value: false

  - contact_attribute:
      tags:
        - datasource_type
      inherits: base
      fields:
        - contact_id:
            references: contact_base.id
        - key:
            type: string
            size: 255
        - value:
            type: string
            size: unlimited

  - address_attribute:
      tags:
        - datasource_type
      inherits: base
      fields:
        - address_id:
            references: address_base.id
        - key:
            type: string
            size: 255
        - value:
            type: string
            size: unlimited

  - email_attribute:
      tags:
        - datasource_type
      inherits: base
      fields:
        - email_id:
            references: email_base.id
        - key:
            type: string
            size: 255
        - value:
            type: string
            size: unlimited

  - phone_attribute:
      tags:
        - datasource_type
      inherits: base
      fields:
        - phone_id:
            references: phone_base.id
        - key:
            type: string
            size: 255
        - value:
            type: string
            size: unlimited

  - label:
      tags:
        - datasource_type
      inherits: base
      fields:
        - name:
            type: string
            size: 255
        - description:
            type: string
            size: unlimited
            default_value: ""

  - contact_label:
      tags:
        - datasource_type
        - many_to_many
      inherits: base
      fields:
        - contact_id:
            references: contact_base.id
        - label_id:
            references: label.id

  - address_label:
      tags:
        - datasource_type
        - many_to_many
      inherits: base
      fields:
        - address_id:
            references: address_base.id
        - label_id:
            references: label.id

  - email_label:
      tags:
        - datasource_type
        - many_to_many
      inherits: base
      fields:
        - email_id:
            references: email_base.id
        - label_id:
            references: label.id

  - phone_label:
      tags:
        - datasource_type
        - many_to_many
      inherits: base
      fields:
        - phone_id:
            references: phone_base.id
        - label_id:
            references: label.id

  - attribute_map:
      tags: 
        - view_type
      inherits: dictionary
      fields:
        - key:
            type: string
            size: 255
        - value:
            type: string
            size: unlimited

  - address:
      tags:
        - view_type
      inherits: address_base
      union:
        - address_type
      extract:
        - address_type.name
        - address_type.description
      mapping:
        name: address_type_name
      remove_fields:
        - address_type_id
      fields:
        - attributes:
            type: attribute_map{}
            references: address_attribute.address_id
        - labels:
            type: label[]
            references: address_label.address_id

  - email:
      tags:
        - view_type 
      inherits: email_base
      union:
        - email_type
      extract:
        - email_type.name
        - email_type.description
      mapping:
        name: email_type_name
      remove_fields:
        - email_type_id
      fields:
        - attributes:
            type: attribute_map{}
            references: email_attribute.email_id
        - labels:
            type: label[]
            references: email_label.email_id

  - phone:
      tags:
        - view_type
      inherits: phone_base
      union:
        - phone_type
      extract:
        - phone_type.name
        - phone_type.description
      mapping:
        name: phone_type_name
      remove_fields:
        - phone_type_id
      fields:
        - attributes:
            type: attribute_map{}
            references: phone_attribute.phone_id
        - labels:
            type: label[]
            references: phone_label.phone_id

  - contact:
      tags:
        - view_type
      inherits: contact_base
      union:
        - gender
      extract:
        - gender.name
      mapping:
        gender.name: gender_type_name
      remove_fields:
        - gender_type_id
      fields:
        - addresses:
            type: address[]
            references: address.contact_id
        - emails:
            type: email[]
            references: email.contact_id
        - phones:
            type: phone[]
            references: phone.contact_id
        - attributes:
            type: attribute_map{}
            references: contact_attribute.contact_id
        - labels:
            type: label[]
            references: contact_label.contact_id
