services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: datasources
      MYSQL_USER: ds
      MYSQL_PASSWORD: ds
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/mysql
    ports:
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uds", "-pds"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ds
      POSTGRES_PASSWORD: ds
      POSTGRES_DB: datasources
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds -d datasources"]
      interval: 5s
      timeout: 5s
      retries: 20
  runner:
    build:
      context: ../../..
      dockerfile: quick_starts/contacts_cli/rust/Dockerfile
    restart: "no"
    stop_grace_period: 0s
    tmpfs:
      - /tmp
      - /work
    working_dir: /work
    environment:
      E2E_LANG: rust
      MYSQL_URL: mysql://ds:ds@mysql:3306/datasources
      POSTGRES_URL: postgres://ds:ds@postgres:5432/datasources
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
