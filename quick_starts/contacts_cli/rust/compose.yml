services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: datasources
      MYSQL_USER: ds
      MYSQL_PASSWORD: ds
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/mysql
    ports:
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uds", "-pds"]
      interval: 1s
      timeout: 2s
      retries: 30
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ds
      POSTGRES_PASSWORD: ds
      POSTGRES_DB: datasources
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds -d datasources"]
      interval: 1s
      timeout: 2s
      retries: 30
  runner:
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    image: datasources-e2e-rust
    build:
      context: ../../../scripts
      dockerfile: e2e-rust.Dockerfile
    pull_policy: never
    restart: "no"
    stop_grace_period: 0s
    tmpfs:
      - /tmp
      - /work
    volumes:
      - ${HOME}/.cache/datasources-npm:/npm-cache
      - ${HOME}/.cache/datasources-cargo:/cargo
      - ${HOME}/.cache/datasources-cargo-target:/cargo-target
      - ${HOME}/.cache/datasources-e2e:/e2e-cache
    working_dir: /work
    environment:
      npm_config_cache: /npm-cache
      CARGO_TARGET_DIR: /cargo-target/contacts-cli-rust
      E2E_LANG: rust
      MYSQL_URL: mysql://ds:ds@mysql:3306/datasources
      POSTGRES_URL: postgres://ds:ds@postgres:5432/datasources
