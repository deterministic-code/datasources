name: contacts-cli
language: csharp
providers: [sqlite, mysql, postgres]
initialize-commands:
  - dotnet new console
  - dotnet add package Datasources
  - npx @deterministic-code/datasources-cli setup --yes --languages csharp --datasources sqlite mysql postgres
copy:
  - from: Program.cs
    to: Program.cs
  - from: ../../deterministics/contacts/types.yaml
    to: deterministic/types.yaml
  - from: ../../deterministics/contacts/datasource.yaml
    to: deterministic/datasource.yaml
  - from: ../../deterministics/contacts/datasource_seeds.yaml
    to: deterministic/datasource_seeds.yaml
  - from: ../../deterministics/contacts/settings.yaml
    to: deterministic/settings.yaml
run-commands:
  - npx @deterministic-code/datasources-cli generate all --dialect csharp
build:
  - dotnet build
run:
  - dotnet run
expected: expected.txt
