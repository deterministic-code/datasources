name: contacts-cli
language: csharp
providers: [sqlite, mysql, postgres]
prepare-copy:
  - from: .
    to: .
prepare-commands:
  - docker compose up -d --wait
initialize-commands:
  - dotnet new console
  - dotnet add package Datasources
  - npx @deterministic-code/datasources-cli setup --yes --languages csharp --datasources sqlite mysql postgres
copy:
  - from: .
    to: .
run-commands:
  - npx @deterministic-code/datasources-cli generate all --dialect csharp
build:
  - dotnet build
run:
  - dotnet run
expected: expected.txt
