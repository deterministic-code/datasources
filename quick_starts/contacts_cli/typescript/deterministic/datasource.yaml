version: 1.0.0
includes:
  - types:
      filter: tag == "datasource_type"
types:
  # created and updated are supplied on Create and Update. SQLite stores
  # datetime as TEXT and does not apply every engine default (UtcNow,
  # CURRENT_TIMESTAMP ON UPDATE) the way MySQL does, so these columns are
  # application-written rather than database-generated.
  - base:
      fields:
        - created:
            is_readonly: false
        - updated:
            is_readonly: false
  - gender:
      fields:
        - name:
            is_unique: true
  - email_type:
      fields:
        - name:
            is_unique: true
  - phone_type:
      fields:
        - name:
            is_unique: true
  - contact_base:
      mapping: contact
  - address_base:
      mapping: address
      indexes:
        - address_contact_id_address_type_id_index:
            fields:
              - contact_id
              - address_type_id
            is_unique: true
  - phone_base:
      mapping: phone
      indexes:
        - contact_id_phone_type_id_index:
            fields:
              - contact_id
              - phone_type_id
            is_unique: true
  - email_base:
      mapping: email
      indexes:
        - contact_id_email_type_id_index:
            fields:
              - contact_id
              - email_type_id
            is_unique: true
  - contact_attribute:
      indexes:
        - contact_attribute_contact_id_name_index:
            fields: [contact_id, key]
            is_unique: false
  - label:
      fields:
        - name:
            is_unique: true

  - contact_label:
      indexes:
        - contact_label_contact_id_label_id_index:
            fields: [contact_id, label_id]
            is_unique: true
        - contact_label_label_id_index:
            fields: [label_id]
            is_unique: false

