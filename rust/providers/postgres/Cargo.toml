[package]
name = "datasources-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Postgres datasource provider"

[dependencies]
async-trait = { workspace = true }
datasources = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "time", "sync"] }
tokio-postgres = "0.7"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "time", "sync"] }
