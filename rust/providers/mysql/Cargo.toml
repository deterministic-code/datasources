[package]
name = "datasources-mysql"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MySQL datasource provider"
autotests = false

[dependencies]
async-trait = { workspace = true }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
datasources = { workspace = true }
futures-core = "0.3"
mysql_async = "0.34"
rust_decimal = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "time", "sync"] }
uuid = "1"

[dev-dependencies]
datasources-sql-specs = { path = "../../sql-specs" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "time", "sync"] }

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib"]
