[workspace]
resolver = "2"
members = [
    "datasources",
    "providers/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/deterministic-code/datasources"

[workspace.dependencies]
async-trait = "0.1"
datasources = { path = "datasources", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt"] }
serde_json = "1"
