[package]
name = "datasources"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Async datasource interfaces, middleware, registry, and test doubles"

[dependencies]
async-trait = { workspace = true }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ctor = { workspace = true }
facet = { version = "0.46", features = ["reflect", "chrono", "uuid", "rust_decimal"] }
regex = "1"
rust_decimal = "1"
tokio = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true }
datasources-memory = { path = "../providers/memory" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
